name: Build .NET portfolio APIs

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/dotnet-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/dotnet-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - TicketFlow.Api
          - FinanceFlow.Api
          - StockWise.Api
          - TaskBoard.Api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore "projects/${{ matrix.project }}/${{ matrix.project }}.csproj"
      - name: Build
        run: dotnet build "projects/${{ matrix.project }}/${{ matrix.project }}.csproj" --no-restore --configuration Release
